<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristiano Ronaldo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <!-- ==========================================================
             PUNTO 2: Sección principal con apariencia de tarjeta
             ========================================================== -->
        <section class="tarjeta">

            <!-- PUNTO 7: Título con degradado de color -->
            <h1>Cristiano Ronaldo</h1>

            <!-- PUNTO 5: Imagen que cambia de tamaño al pasar el cursor -->
            <img src="Bicho.png" alt="Cristiano Ronaldo" class="imagen" width="300px">

            <p>
                Delantero portugués considerado uno de los mejores futbolistas
                de la historia. Actualmente juega en el Al-Nassr y es el máximo
                goleador histórico del fútbol.
            </p>

            <!-- PUNTO 3: Botón animado (crece al pasar el cursor) -->
            <button class="boton">Ver más</button>

            <!-- PUNTO 6: Botón con sombra animada -->
            <button class="boton-sombra">Seguir</button>

        </section>

        <!-- ==========================================================
             PUNTO 8: Tarjeta que se eleva utilizando transform
             ========================================================== -->
        <div class="tarjeta-eleva">
            <h2>CR7</h2>
            <p>Pasa el cursor sobre esta tarjeta para verla elevarse.</p>
        </div>

    </main>

    <!-- ==========================================================
         PUNTO 4: Pie de página
         ========================================================== -->
    <footer class="pie">
        <p>Lab 01 - Programación Web - Andry González - 2000924</p>
    </footer>

</body>
</html>
